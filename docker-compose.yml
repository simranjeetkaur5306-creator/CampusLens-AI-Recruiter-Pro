
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: campuslens_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campuslens
      POSTGRES_USER: campuslens_user
      POSTGRES_PASSWORD: campuslens123
    ports:
      - "5432:5432"
    volumes:
      - campuslens_pgdata:/var/lib/postgresql/data

volumes:
  campuslens_pgdata:
